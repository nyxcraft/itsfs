name: CI

# Builds the toolkit and runs tests/run.sh.  The suite is self-contained -- it
# builds every fixture it uses, including a complete little ITS file system poked
# into a sparse image with dd, and never reads a real ITS pack, which is not in
# this repo and never will be -- so it runs anywhere.
#
# Three project claims are enforced here rather than trusted:
#
#   - "dependency-free C99, -pedantic clean". The Makefile's default CFLAGS warn
#     but do not fail, so CI overrides them with -Werror: a warning fails the
#     build instead of scrolling past. Both gcc and clang, because each sees
#     things the other does not, and macOS because "runs on any modern host" is
#     a claim and not a hope.
#
#   - memory safety on hostile input. Every command here parses a file nobody in
#     this repo wrote, and about a third of the suite feeds it a pack damaged on
#     purpose. An out-of-bounds READ does not fault on a normal build -- it
#     returns whatever was next in memory and the test passes -- so the sanitizer
#     job is the only place several of those checks have teeth.
#
#   - the optional dependency still builds. `mount` is the one thing here that
#     needs a library, so it is off by default -- which meant nothing compiled it
#     but its author's machine, and it could have broken with every job green.
#     The FUSE job builds it, lints it under the local warning set, and runs the
#     mount suite, which skips itself where a runner cannot mount.
#
#   - the formatting rule is real. .clang-format says hand-aligned tables must be
#     fenced with `clang-format off`, because the tool collapses the columns that
#     ARE the documentation -- and src/its.h is one large table of exactly that
#     kind. The lint job checks it with a PINNED clang-format, because a
#     formatter is a moving target and a check that fails on its release schedule
#     gets switched off. Only the format half runs here: whether a compiler emits
#     a given warning is version-dependent, so that half stays local.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Makefile'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Makefile'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.cc }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, cc: gcc }
          - { os: ubuntu-latest, cc: clang }
          - { os: macos-latest,  cc: clang }
    steps:
      - uses: actions/checkout@v7

      - name: Build (warnings are errors)
        run: make CC=${{ matrix.cc }} CFLAGS="-std=c99 -O2 -Wall -Wextra -pedantic -Werror"

      - name: Test
        run: make CC=${{ matrix.cc }} test

  sanitizers:
    name: ubuntu-latest / ASan+UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run the suite under AddressSanitizer and UBSan
        run: make test-san

      - name: Damage a pack on purpose, 100 ways, and require no finding
        run: make fuzz ITERS=100

  fuse:
    name: ubuntu-latest / FUSE=1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install libfuse3
        run: sudo apt-get update && sudo apt-get install -y libfuse3-dev fuse3

      - name: Build with the mount in it (warnings are errors)
        run: make FUSE=1 CFLAGS="-std=c99 -O2 -Wall -Wextra -pedantic -Werror"

      # The local warning set is 16 options wide and is where the mount's own
      # problems showed up; -Werror is inside the lint target itself.
      - name: The mount is clean under the wider warning set
        run: make lint FUSE=1

      # The default build has no mount, so the rest of the suite still has to
      # pass with one compiled in: nothing about `mount` may change `ls`.
      - name: The suite still passes with the mount compiled in
        run: make FUSE=1 test

      # Skips itself, loudly, on a runner that cannot mount.
      - name: The mount reads what the commands read
        run: make mount-test FUSE=1

  lint:
    name: ubuntu-latest / format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install the pinned clang-format
        run: pip install 'clang-format==18.1.3'

      - name: Sources are clang-format clean, tables fenced
        run: make lint-format
